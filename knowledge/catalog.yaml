title: "Radar Flow Analyzer"
subtitle: "雷达数据链路知识可视化与流程说明工具"
overview:
  what: "雷达是一种利用电磁波探测目标的技术，用于检测目标是否存在、测量距离和速度，并判断运动状态。"
  modules: "雷达通常由微波/射频源、发射机、天线、接收机、滤波器、放大器、混频器、ADC、DSP/MCU 和输出接口等模块构成。"
  how: "雷达发射信号并接收回波，通过比较时延、相位变化和频率偏移，恢复目标的距离、速度和状态。"
foundation:
  chapters:
    - id: "01"
      title: "从 24 GHz 电磁波到 I/Q 数据"
      summary: "从电磁波、频率、调制与接收数字化开始理解雷达输入。"
    - id: "02"
      title: "从 I/Q 变化到人体运动"
      summary: "把相位变化和运动过程连接起来，理解人体怎样影响回波。"
    - id: "03"
      title: "怎样从雷达信号中找到人体线索"
      summary: "从时域与频域特征中提取可观测的运动线索。"
    - id: "04"
      title: "FMCW 雷达怎样看见距离和速度"
      summary: "理解 Range FFT、Doppler FFT 和 Range-Doppler 的意义。"
    - id: "05"
      title: "从目标与特征到有人/无人"
      summary: "从候选目标与特征构成最终状态判断。"
flow:
  steps:
    - name: "iq"
      title: "ADC / IQ"
      description: "从模拟回波转换为数字信号，保留幅度和相位信息。"
    - name: "range_fft"
      title: "Range FFT"
      description: "将时延转换为距离信息，形成距离维度的能量分布。"
    - name: "doppler_fft"
      title: "Doppler FFT"
      description: "从多 Chirp 的相位变化中提取速度维度的信息。"
    - name: "range_doppler"
      title: "Range-Doppler"
      description: "同时展现距离和速度，形成候选目标的二维观察视图。"
    - name: "candidate"
      title: "Candidate / Feature"
      description: "从二维图中筛选候选目标，并提取稳定特征。"
    - name: "presence"
      title: "Presence"
      description: "基于帧级或跨帧证据形成最终有人/无人状态。"
scenarios:
  - key: "normal"
    title: "正常目标场景"
    summary: "目标清晰、链路稳定，作为基础案例。"
    focus: "理解正常流程与特征构成。"
  - key: "non_integer_bin"
    title: "非整数 bin 场景"
    summary: "目标峰值偏移，说明泄漏和峰值估计问题。"
    focus: "理解非理想 bin 与估计误差。"
  - key: "weak_target"
    title: "强背景弱目标场景"
    summary: "背景较强，目标较弱，需要候选与特征分流。"
    focus: "理解误报与漏报的边界。"
  - key: "presence_state"
    title: "连续帧 Presence 场景"
    summary: "逐帧证据累积，最终形成稳定状态。"
    focus: "理解跨帧状态机与稳定性。"
  - key: "real_data"
    title: "真实数据入口"
    summary: "展示真实数据与仿真数据的差异，以及不同处理层的结论边界。"
    focus: "理解真实数据分析的前提与限制。"
